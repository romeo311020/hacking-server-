<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>صفحة جديدة — ROMANY</title>
    <meta name="theme-color" content="#00f2fe">
    <meta name="description" content="وصف الصفحة">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="my-page">
    <!-- 1) غيّر data-page أعلاه لنفس الـ id اللي هتكتبه في js/tools.js
         2) اكتب محتوى الصفحة داخل <main> فقط — الهيدر والتنقل بيتضافوا تلقائي -->
    <main>
        <a class="back-nav" href="index.html"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>

        <div class="cyber-panel-card">
            <div class="panel-head">
                <div><h2>عنوان الأداة</h2><p>وصف قصير</p></div>
                <span class="tag">READY</span>
            </div>

            <div class="cyber-form-container">
                <div class="cyber-input-group">
                    <i class="fa-solid fa-terminal"></i>
                    <input type="text" id="my-input" placeholder="...">
                </div>
                <button class="fire-btn cyan-fire" id="my-btn"><span>تنفيذ</span><i class="fa-solid fa-play"></i></button>
            </div>
        </div>
    </main>

    <script src="js/tools.js"></script>
    <script src="js/app.js"></script>
    <script>
        // نفس أدوات التطبيق متاحة عبر window.Romany
        document.getElementById('my-btn').onclick = () => {
            Romany.toast('شغّال! 🎉', 'success');
            Romany.bumpScans();
        };
    </script>
</body>
</html>
