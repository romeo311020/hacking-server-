<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>اختبار السيرفرات — ROMANY</title>
    <meta name="theme-color" content="#00f2fe">
    <meta name="description" content="تشغيل واختبار روابط HLS وفيديو مباشر وصفحات Embed">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="tester">
    <main>
        <a class="back-nav" href="index.html"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>

        <div class="cyber-panel-card">
            <div class="panel-head">
                <div>
                    <h2 id="tester-title">اختبار السيرفرات</h2>
                    <p id="tester-sub">الصق رابط الفيديو أو البث أو صفحة الـ Embed وشغّله مباشرة</p>
                </div>
                <span class="tag" id="tester-tag">READY_TO_SCAN</span>
            </div>

            <div class="server-switch" id="server-switch" style="display:flex; gap:8px; flex-wrap:wrap;"></div>

            <div class="cyber-form-container">
                <div class="cyber-input-group">
                    <i class="fa-solid fa-terminal"></i>
                    <input type="text" id="stream-url-input" inputmode="url" autocomplete="off" spellcheck="false"
                           placeholder="أدخل رابط فيديو السيرفر، صفحة الويب، أو بث الـ HLS...">
                    <button class="paste-btn" id="paste-btn" title="لصق من الحافظة" aria-label="لصق"><i class="fa-solid fa-paste"></i></button>
                </div>
                <button class="fire-btn cyan-fire" id="run-btn"><span>تشغيل وتجربة السيرفر</span><i class="fa-solid fa-play"></i></button>
            </div>

            <div class="hacker-console" id="tester-console"></div>

            <div class="video-wrapper" id="tester-video-wrapper">
                <div id="player-dynamic-target" style="width:100%;height:100%;"></div>
                <div class="player-overlay-controls" id="custom-player-controls">
                    <div class="timeline-container" id="timeline"><div class="timeline-bar" id="media-progress-bar"></div></div>
                    <div class="control-shelf">
                        <div class="shelf-group">
                            <button class="player-icon-btn" id="btn-play" aria-label="تشغيل/إيقاف"><i id="media-play-icon" class="fa-solid fa-play"></i></button>
                            <button class="player-icon-btn" id="btn-mute" aria-label="كتم"><i id="mute-icon" class="fa-solid fa-volume-high"></i></button>
                            <span style="font-size:.8rem;font-family:monospace;direction:ltr" id="player-time-display">00:00 / 00:00</span>
                        </div>
                        <div class="shelf-group">
                            <button class="player-icon-btn" id="btn-full" aria-label="ملء الشاشة"><i class="fa-solid fa-expand"></i></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="player-status" id="player-status"></div>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/app.js"></script>
    <script src="js/analyzer.js"></script>
    <script src="js/player.js"></script>
    <script src="js/pages/tester.js"></script>
</body>
</html>
